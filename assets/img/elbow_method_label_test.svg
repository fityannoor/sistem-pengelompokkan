<text x="98" y="768.00" class="tick" text-anchor="end">7</text><text x="98" y="629.60" class="tick" text-anchor="end">8</text><text x="98" y="491.20" class="tick" text-anchor="end">9</text><text x="98" y="352.80" class="tick" text-anchor="end">10</text><text x="98" y="214.40" class="tick" text-anchor="end">11</text><text x="98" y="76.00" class="tick" text-anchor="end">12</text>
