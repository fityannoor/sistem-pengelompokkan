    .line { fill: none; stroke: #1f2f9b; stroke-width: 4; }
    .point { fill: #1f2f9b; stroke: #1f2f9b; }
    .best-line { stroke: #ff1f1f; stroke-width: 4; stroke-dasharray: 12 6; }
